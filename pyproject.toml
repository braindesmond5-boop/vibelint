[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibelint"
version = "0.3.1"
description = "Find the mistakes AI leaves behind in your code. Like tests, but for AI slop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Desmond Akordor Brain Acquah" }]
keywords = [
    "ai",
    "linter",
    "static-analysis",
    "hallucination",
    "code-quality",
    "llm",
    "vibe-coding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/braindesmond5-boop/vibelint"
Repository = "https://github.com/braindesmond5-boop/vibelint"
Issues = "https://github.com/braindesmond5-boop/vibelint/issues"

[project.scripts]
vibelint = "vibelint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
