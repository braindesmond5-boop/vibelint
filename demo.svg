            <text y="101.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">app.py</tspan></text>
      <text y="122.0"><tspan x="38.8" fill="#6b7185">    3</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST IMPORT    </tspan><tspan x="257.2" fill="#c8ccd8">  `fastjson` does not exist: not in the standard library, not installed, not part of this project, and not in your dependencies</tspan></text>
      <text y="143.0"><tspan x="97.6" fill="#6b7185">|  import fastjson</tspan></text>
      <text y="164.0"><tspan x="97.6" fill="#6b7185">-&gt; Check the real package name before installing anything with this name - attackers register hallucinated package names on PyPI.</tspan></text>
      <text y="185.0"><tspan x="38.8" fill="#6b7185">    4</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST IMPORT    </tspan><tspan x="257.2" fill="#c8ccd8">  `datetime_helpers` does not exist: not in the standard library, not installed, not part of this project, and not in your dependencies</tspan></text>
      <text y="206.0"><tspan x="97.6" fill="#6b7185">|  from datetime_helpers import parse_relative_date</tspan></text>
      <text y="227.0"><tspan x="97.6" fill="#6b7185">-&gt; Check the real package name before installing anything with this name - attackers register hallucinated package names on PyPI.</tspan></text>
      <text y="248.0"><tspan x="38.8" fill="#6b7185">   13</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST FUNCTION  </tspan><tspan x="257.2" fill="#c8ccd8">  `sanitize_input()` is not defined anywhere in this project or the standard library</tspan></text>
      <text y="269.0"><tspan x="97.6" fill="#6b7185">|  clean_order = sanitize_input(order)</tspan></text>
      <text y="290.0"><tspan x="97.6" fill="#6b7185">-&gt; Write `sanitize_input()`, or replace the call with something that exists.</tspan></text>
      <text y="311.0"><tspan x="38.8" fill="#6b7185">   19</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">LOST AWAIT      </tspan><tspan x="257.2" fill="#c8ccd8">  charge_customer() is async; `charge` holds a coroutine that is never awaited</tspan></text>
      <text y="332.0"><tspan x="97.6" fill="#6b7185">|  charge = services.charge_customer(clean_order[&quot;customer_id&quot;], final_total)</tspan></text>
      <text y="353.0"><tspan x="97.6" fill="#6b7185">-&gt; Write `charge = await charge_customer(...)`.</tspan></text>
      <text y="374.0"><tspan x="38.8" fill="#6b7185">   24</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST METHOD    </tspan><tspan x="257.2" fill="#c8ccd8">  `utils` has no `format_timestamp` - this call fails with AttributeError</tspan></text>
      <text y="395.0"><tspan x="97.6" fill="#6b7185">|  &quot;issued_at&quot;: utils.format_timestamp(clean_order[&quot;created_at&quot;]),</tspan></text>
      <text y="416.0"><tspan x="97.6" fill="#6b7185">-&gt; Write `format_timestamp()` in utils, or call something that exists.</tspan></text>
      <text y="437.0"><tspan x="38.8" fill="#6b7185">   27</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">LOST AWAIT      </tspan><tspan x="257.2" fill="#c8ccd8">  send_email() is async, but it is called without `await`, so its body never runs</tspan></text>
      <text y="458.0"><tspan x="97.6" fill="#6b7185">|  services.send_email(</tspan></text>
      <text y="479.0"><tspan x="97.6" fill="#6b7185">-&gt; Write `await send_email(...)`.</tspan></text>
      <text y="500.0"><tspan x="38.8" fill="#6b7185">   41</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  `except Exception` is ignored silently, so this failure will never be seen</tspan></text>
      <text y="521.0"><tspan x="97.6" fill="#6b7185">|  except Exception:</tspan></text>
      <text y="542.0"><tspan x="97.6" fill="#6b7185">-&gt; Log it, re-raise it, or handle it. If it is genuinely safe to ignore, say why in a comment.</tspan></text>
      <text y="563.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">config.py</tspan></text>
      <text y="584.0"><tspan x="38.8" fill="#6b7185">    6</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE VALUE      </tspan><tspan x="257.2" fill="#c8ccd8">  `API_KEY` is set to a value that starts with 'your-', so anything using it will fail against a real service</tspan></text>
      <text y="605.0"><tspan x="97.6" fill="#6b7185">|  API_KEY = &quot;your-api-key-here&quot;</tspan></text>
      <text y="626.0"><tspan x="97.6" fill="#6b7185">-&gt; Read it from the environment: `os.environ[&quot;API_KEY&quot;]`.</tspan></text>
      <text y="647.0"><tspan x="38.8" fill="#6b7185">    7</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE FALLBACK   </tspan><tspan x="257.2" fill="#c8ccd8">  if `STRIPE_SECRET_KEY` is unset, this silently falls back to a value that is a fake API key shaped like a real one</tspan></text>
      <text y="668.0"><tspan x="97.6" fill="#6b7185">|  STRIPE_SECRET_KEY = os.getenv(&quot;STRIPE_SECRET_KEY&quot;, &quot;sk-test-placeholder&quot;)</tspan></text>
      <text y="689.0"><tspan x="97.6" fill="#6b7185">-&gt; Fail loudly instead: `os.environ[&quot;STRIPE_SECRET_KEY&quot;]` raises if it is missing, which is what you want for required configuration.</tspan></text>
      <text y="710.0"><tspan x="38.8" fill="#6b7185">    9</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">FAKE ENDPOINT   </tspan><tspan x="257.2" fill="#c8ccd8">  `https://api.example.com/v1` points at a documentation placeholder domain, not a real service</tspan></text>
      <text y="731.0"><tspan x="97.6" fill="#6b7185">|  BASE_URL = &quot;https://api.example.com/v1&quot;</tspan></text>
      <text y="752.0"><tspan x="97.6" fill="#6b7185">-&gt; Point this at your actual endpoint, or move it into configuration.</tspan></text>
      <text y="773.0"><tspan x="38.8" fill="#6b7185">   10</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">FAKE ENDPOINT   </tspan><tspan x="257.2" fill="#c8ccd8">  `https://your-domain.com/webhooks/payment` points at a documentation placeholder domain, not a real service</tspan></text>
      <text y="794.0"><tspan x="97.6" fill="#6b7185">|  WEBHOOK_URL = &quot;https://your-domain.com/webhooks/payment&quot;</tspan></text>
      <text y="815.0"><tspan x="97.6" fill="#6b7185">-&gt; Point this at your actual endpoint, or move it into configuration.</tspan></text>
      <text y="836.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">services.py</tspan></text>
      <text y="857.0"><tspan x="38.8" fill="#6b7185">   15</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `time.sleep()` blocks the event loop inside async `send_email()`, freezing every other task</tspan></text>
      <text y="878.0"><tspan x="97.6" fill="#6b7185">|  time.sleep(0.5)</tspan></text>
      <text y="899.0"><tspan x="97.6" fill="#6b7185">-&gt; Use asyncio.sleep instead of time.sleep.</tspan></text>
      <text y="920.0"><tspan x="38.8" fill="#6b7185">   17</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `requests.post()` blocks the event loop inside async `send_email()`, freezing every other task</tspan></text>
      <text y="941.0"><tspan x="97.6" fill="#6b7185">|  response = requests.post(f&quot;{config.BASE_URL}/email&quot;, json=payload)</tspan></text>
      <text y="962.0"><tspan x="97.6" fill="#6b7185">-&gt; Use an async client such as httpx.AsyncClient instead of requests.</tspan></text>
      <text y="983.0"><tspan x="38.8" fill="#6b7185">   23</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">MODEL CONFESSION</tspan><tspan x="257.2" fill="#c8ccd8">  the model is telling you this code is not the real implementation</tspan></text>
      <text y="1004.0"><tspan x="97.6" fill="#6b7185">|  # In a real implementation, you would verify the payment method here</tspan></text>
      <text y="1025.0"><tspan x="97.6" fill="#6b7185">-&gt; Write the real implementation, or delete the comment and the code it excuses.</tspan></text>
      <text y="1046.0"><tspan x="38.8" fill="#6b7185">   27</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `requests.post()` blocks the event loop inside async `charge_customer()`, freezing every other task</tspan></text>
      <text y="1067.0"><tspan x="97.6" fill="#6b7185">|  response = requests.post(f&quot;{config.BASE_URL}/charges&quot;, json=payload)</tspan></text>
      <text y="1088.0"><tspan x="97.6" fill="#6b7185">-&gt; Use an async client such as httpx.AsyncClient instead of requests.</tspan></text>
      <text y="1109.0"><tspan x="38.8" fill="#6b7185">   29</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  `except Exception` is ignored silently, so this failure will never be seen</tspan></text>
      <text y="1130.0"><tspan x="97.6" fill="#6b7185">|  except Exception:</tspan></text>
      <text y="1151.0"><tspan x="97.6" fill="#6b7185">-&gt; Log it, re-raise it, or handle it. If it is genuinely safe to ignore, say why in a comment.</tspan></text>
      <text y="1172.0"><tspan x="38.8" fill="#6b7185">   38</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  bare `except:` catches everything, including Ctrl-C and system exits and then discards it</tspan></text>
      <text y="1193.0"><tspan x="97.6" fill="#6b7185">|  except:</tspan></text>
      <text y="1214.0"><tspan x="97.6" fill="#6b7185">-&gt; Catch the specific exception you expect, e.g. `except ValueError:`.</tspan></text>
      <text y="1235.0"><tspan x="38.8" fill="#6b7185">   41</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">SWALLOWED RETURN</tspan><tspan x="257.2" fill="#c8ccd8">  `return` inside `finally` silently discards any exception in flight</tspan></text>
      <text y="1256.0"><tspan x="97.6" fill="#6b7185">|  return {&quot;status&quot;: &quot;unknown&quot;}</tspan></text>
      <text y="1277.0"><tspan x="97.6" fill="#6b7185">-&gt; Move the return outside the finally block.</tspan></text>
      <text y="1298.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">tests/test_orders.py</tspan></text>
      <text y="1319.0"><tspan x="38.8" fill="#6b7185">   11</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE ASSERT     </tspan><tspan x="257.2" fill="#c8ccd8">  `assert True` is true no matter what the code does</tspan></text>
      <text y="1340.0"><tspan x="97.6" fill="#6b7185">|  assert True</tspan></text>
      <text y="1361.0"><tspan x="97.6" fill="#6b7185">-&gt; Assert on a value the code under test produced.</tspan></text>
      <text y="1382.0"><tspan x="38.8" fill="#6b7185">   14</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">TEST THEATER    </tspan><tspan x="257.2" fill="#c8ccd8">  test_truncate_long_text() runs code but never asserts anything, so it can only fail if the code crashes</tspan></text>
      <text y="1403.0"><tspan x="97.6" fill="#6b7185">|  def test_truncate_long_text():</tspan></text>
      <text y="1424.0"><tspan x="97.6" fill="#6b7185">-&gt; Assert on the result. A test that cannot fail is worse than no test, because it reads as coverage.</tspan></text>
      <text y="1445.0"><tspan x="38.8" fill="#6b7185">   21</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE ASSERT     </tspan><tspan x="257.2" fill="#c8ccd8">  `assert 1 == 1` is true no matter what the code does</tspan></text>
      <text y="1466.0"><tspan x="97.6" fill="#6b7185">|  assert 1 == 1</tspan></text>
      <text y="1487.0"><tspan x="97.6" fill="#6b7185">-&gt; Assert on a value the code under test produced.</tspan></text>
      <text y="1508.0"><tspan x="38.8" fill="#6b7185">   24</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">MOCK TAUTOLOGY  </tspan><tspan x="257.2" fill="#c8ccd8">  test_charge_customer() only asserts on mocks it configured itself, so it tests the mock rather than the code</tspan></text>
      <text y="1529.0"><tspan x="97.6" fill="#6b7185">|  def test_charge_customer():</tspan></text>
      <text y="1550.0"><tspan x="97.6" fill="#6b7185">-&gt; Assert on the real return value, or verify the call the code made instead.</tspan></text>
      <text y="1571.0"><tspan x="38.8" fill="#6b7185">   35</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">MOCK TAUTOLOGY  </tspan><tspan x="257.2" fill="#c8ccd8">  test_email_validation() only asserts on mocks it configured itself, so it tests the mock rather than the code</tspan></text>
      <text y="1592.0"><tspan x="97.6" fill="#6b7185">|  def test_email_validation():</tspan></text>
      <text y="1613.0"><tspan x="97.6" fill="#6b7185">-&gt; Assert on the real return value, or verify the call the code made instead.</tspan></text>
      <text y="1634.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">utils.py</tspan></text>
      <text y="1655.0"><tspan x="38.8" fill="#6b7185">   25</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">PLACEHOLDER     </tspan><tspan x="257.2" fill="#c8ccd8">  calculate_discount() has a docstring describing what it does, and no code that does it</tspan></text>
      <text y="1676.0"><tspan x="97.6" fill="#6b7185">|  def calculate_discount(order_total, customer_tier):</tspan></text>
      <text y="1697.0"><tspan x="97.6" fill="#6b7185">-&gt; Implement it, or mark it @abstractmethod so callers know it is intentionally unfinished.</tspan></text>
      <text y="1718.0"><tspan x="38.8" fill="#6b7185">   29</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">PLACEHOLDER     </tspan><tspan x="257.2" fill="#c8ccd8">  validate_email() raises NotImplementedError but is not marked abstract</tspan></text>
      <text y="1739.0"><tspan x="97.6" fill="#6b7185">|  def validate_email(address):</tspan></text>
      <text y="1760.0"><tspan x="97.6" fill="#6b7185">-&gt; Implement it, or mark it @abstractmethod so callers know it is intentionally unfinished.</tspan></text>
