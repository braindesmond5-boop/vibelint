<svg xmlns="http://www.w3.org/2000/svg" width="1423" height="805" viewBox="0 0 1423 805" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
  <rect width="1423" height="805" rx="10" fill="#12131a"/>
  <path d="M0 10a10 10 0 0 1 10-10h1403a10 10 0 0 1 10 10v24H0z" fill="#1b1d27"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="39" cy="17" r="6" fill="#febc2e"/><circle cx="58" cy="17" r="6" fill="#28c840"/>
  <text x="712" y="21" fill="#666b7d" text-anchor="middle" font-size="12">vibelint</text>
  <g>
    <animate id="loop" attributeName="opacity" from="1" to="1" begin="0s;loop.end+0.4s" dur="6.33s"/>
        <g opacity="0"><text y="67.0"><tspan x="22.0" fill="#5ee0a0" font-weight="600">$ </tspan><tspan x="38.8" fill="#c8ccd8">vibelint examples/vibe_coded_app --quiet</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="109.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">app.py</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.11s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="130.0"><tspan x="38.8" fill="#666b7d">    3</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST IMPORT    </tspan><tspan x="257.2" fill="#c8ccd8">  `fastjson` does not exist: not in the standard library, not installed, not part of this project, and not in your dependencies</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.17s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="151.0"><tspan x="38.8" fill="#666b7d">    4</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST IMPORT    </tspan><tspan x="257.2" fill="#c8ccd8">  `datetime_helpers` does not exist: not in the standard library, not installed, not part of this project, and not in your dependencies</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.22s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="172.0"><tspan x="38.8" fill="#666b7d">   13</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST FUNCTION  </tspan><tspan x="257.2" fill="#c8ccd8">  `sanitize_input()` is not defined anywhere in this project or the standard library</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.28s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="193.0"><tspan x="38.8" fill="#666b7d">   19</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">LOST AWAIT      </tspan><tspan x="257.2" fill="#c8ccd8">  charge_customer() is async; `charge` holds a coroutine that is never awaited</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="214.0"><tspan x="38.8" fill="#666b7d">   24</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">GHOST METHOD    </tspan><tspan x="257.2" fill="#c8ccd8">  `utils` has no `format_timestamp` - this call fails with AttributeError</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.39s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="235.0"><tspan x="38.8" fill="#666b7d">   27</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">LOST AWAIT      </tspan><tspan x="257.2" fill="#c8ccd8">  send_email() is async, but it is called without `await`, so its body never runs</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.44s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="256.0"><tspan x="38.8" fill="#666b7d">   41</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  `except Exception` is ignored silently, so this failure will never be seen</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.49s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="277.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">config.py</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="298.0"><tspan x="38.8" fill="#666b7d">    6</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE VALUE      </tspan><tspan x="257.2" fill="#c8ccd8">  `API_KEY` is set to a value that starts with 'your-', so anything using it will fail against a real service</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="319.0"><tspan x="38.8" fill="#666b7d">    7</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE FALLBACK   </tspan><tspan x="257.2" fill="#c8ccd8">  if `STRIPE_SECRET_KEY` is unset, this silently falls back to a value that is a fake API key shaped like a real one</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.66s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="340.0"><tspan x="38.8" fill="#666b7d">    9</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">FAKE ENDPOINT   </tspan><tspan x="257.2" fill="#c8ccd8">  `https://api.example.com/v1` points at a documentation placeholder domain, not a real service</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.71s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="361.0"><tspan x="38.8" fill="#666b7d">   10</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">FAKE ENDPOINT   </tspan><tspan x="257.2" fill="#c8ccd8">  `https://your-domain.com/webhooks/payment` points at a documentation placeholder domain, not a real service</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.77s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="382.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">services.py</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.82s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="403.0"><tspan x="38.8" fill="#666b7d">   15</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `time.sleep()` blocks the event loop inside async `send_email()`, freezing every other task</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.88s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="424.0"><tspan x="38.8" fill="#666b7d">   17</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `requests.post()` blocks the event loop inside async `send_email()`, freezing every other task</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.94s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="445.0"><tspan x="38.8" fill="#666b7d">   23</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">MODEL CONFESSION</tspan><tspan x="257.2" fill="#c8ccd8">  the model is telling you this code is not the real implementation</tspan></text><animate attributeName="opacity" from="0" to="1" begin="0.99s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="466.0"><tspan x="38.8" fill="#666b7d">   27</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">BLOCKING ASYNC  </tspan><tspan x="257.2" fill="#c8ccd8">  `requests.post()` blocks the event loop inside async `charge_customer()`, freezing every other task</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="487.0"><tspan x="38.8" fill="#666b7d">   29</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  `except Exception` is ignored silently, so this failure will never be seen</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="508.0"><tspan x="38.8" fill="#666b7d">   38</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">SILENT FAIL     </tspan><tspan x="257.2" fill="#c8ccd8">  bare `except:` catches everything, including Ctrl-C and system exits and then discards it</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.16s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="529.0"><tspan x="38.8" fill="#666b7d">   41</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">SWALLOWED RETURN</tspan><tspan x="257.2" fill="#c8ccd8">  `return` inside `finally` silently discards any exception in flight</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.21s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="550.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">tests/test_orders.py</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.26s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="571.0"><tspan x="38.8" fill="#666b7d">   11</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE ASSERT     </tspan><tspan x="257.2" fill="#c8ccd8">  `assert True` is true no matter what the code does</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.32s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="592.0"><tspan x="38.8" fill="#666b7d">   14</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">TEST THEATER    </tspan><tspan x="257.2" fill="#c8ccd8">  test_truncate_long_text() runs code but never asserts anything, so it can only fail if the code crashes</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.38s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="613.0"><tspan x="38.8" fill="#666b7d">   21</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">FAKE ASSERT     </tspan><tspan x="257.2" fill="#c8ccd8">  `assert 1 == 1` is true no matter what the code does</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.43s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="634.0"><tspan x="38.8" fill="#666b7d">   24</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">MOCK TAUTOLOGY  </tspan><tspan x="257.2" fill="#c8ccd8">  test_charge_customer() only asserts on mocks it configured itself, so it tests the mock rather than the code</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.49s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="655.0"><tspan x="38.8" fill="#666b7d">   35</tspan><tspan x="97.6" fill="#ffc457" font-weight="600">!</tspan><tspan x="122.8" fill="#ffc457">MOCK TAUTOLOGY  </tspan><tspan x="257.2" fill="#c8ccd8">  test_email_validation() only asserts on mocks it configured itself, so it tests the mock rather than the code</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.54s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="676.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">utils.py</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.59s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="697.0"><tspan x="38.8" fill="#666b7d">   25</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">PLACEHOLDER     </tspan><tspan x="257.2" fill="#c8ccd8">  calculate_discount() has a docstring describing what it does, and no code that does it</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="718.0"><tspan x="38.8" fill="#666b7d">   29</tspan><tspan x="97.6" fill="#ff6b81" font-weight="600">x</tspan><tspan x="122.8" fill="#ff6b81">PLACEHOLDER     </tspan><tspan x="257.2" fill="#c8ccd8">  validate_email() raises NotImplementedError but is not marked abstract</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.71s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="739.0"><tspan x="38.8" fill="#666b7d">────────────────────────────────────────────────────────────</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.76s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="760.0"><tspan x="38.8" fill="#c8ccd8" font-weight="600">25 flops</tspan><tspan x="106.0" fill="#666b7d">  ·  </tspan><tspan x="148.0" fill="#ff6b81">16 critical</tspan><tspan x="240.4" fill="#666b7d">  ·  </tspan><tspan x="282.4" fill="#ffc457">9 warnings</tspan><tspan x="366.4" fill="#666b7d">  ·  </tspan><tspan x="408.4" fill="#666b7d">5 of 5 files affected</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.81s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
    <g opacity="0"><text y="781.0"><tspan x="22.0" fill="#666b7d">  checked in 0.27s</tspan></text><animate attributeName="opacity" from="0" to="1" begin="1.87s" dur="0.12s" fill="freeze" repeatCount="1"/><animate attributeName="opacity" to="0" begin="5.92s" dur="0.01s" fill="freeze"/></g>
  </g>
</svg>
